# Development environment.
# Base URLs are addressed by alias from feature files: Given I use the "default" API
api.default.base.url=https://jsonplaceholder.typicode.com

# Named test data. Feature files reference these as "CORRECT" "USER_ID" etc.
# INCORRECT / INVALID / NULL variants are derived automatically; EXPIRED_<NAME> is looked up explicitly.
# Secrets must NOT live here: export DATA_API_KEY=... (env var) or pass -Ddata.API_KEY=... instead.
data.USER_ID=1
data.POST_ID=1
data.USER_EMAIL=Sincere@april.biz
data.API_KEY=demo-key-not-a-secret
data.EXPIRED_API_KEY=demo-key-expired
